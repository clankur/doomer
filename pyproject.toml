[project]
name = "doomer"
version = "0.1.0"
description = "Doom RL training: REINFORCE → PPO → GRPO"
requires-python = ">=3.11"

dependencies = [
    "vizdoom>=1.2.4",
    "gymnasium>=1.0",
    "hydra-core>=1.3",
    "opencv-python-headless",
    "numpy>=1.24",
    "einops",
    "wandb",
    "runq",
]

[project.optional-dependencies]
cpu = ["torch"]
gpu = ["torch"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]
runq = { git = "ssh://git@github.com/clankur/runq.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
]
