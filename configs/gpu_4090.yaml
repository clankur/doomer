# uv run python -m train --config-name=gpu_4090 ++paths.model_name=reinforce_001
defaults:
  - base
  - _self_

env:
  scenario: "VizdoomBasic-v1"
  frame_skip: 4
  frame_stack: 4
  resolution: 84
  max_episode_steps: 300

training:
  learning_rate: 3.e-4
  gamma: 0.98
  max_episodes: 10000
  log_interval: 50
  checkpoint_interval: 1000
  seed: 42
