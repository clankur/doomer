# uv run python -m train --config-name=gpu_4090 ++paths.model_name=grpo_001
defaults:
  - base
  - _self_

env:
  scenario: "VizdoomBasic-v1"
  frame_skip: 4
  frame_stack: 4
  resolution: 84
  max_episode_steps: 300
  dense_reward: true

training:
  learning_rate: 5.e-4
  gamma: 0.99
  max_episodes: 10000
  log_interval: 10
  checkpoint_interval: 1000
  seed: 42
  entropy_coeff: 0.02
  group_size: 8
