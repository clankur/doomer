# uv run python -m train --config-name=local_test ++paths.model_name=smoke_000
defaults:
  - base
  - _self_

env:
  scenario: "VizdoomBasic-v1"
  resolution: 84
  max_episode_steps: 100

training:
  learning_rate: 3.e-4
  max_episodes: 50
  log_interval: 5
  checkpoint_interval: 25
  seed: 0
  ppo_epochs: 2
