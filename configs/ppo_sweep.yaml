# Base config for PPO hyperparameter sweep runs.
# Training hparams are overridden per-run by sweep.py.
# uv run python sweep.py
defaults:
  - base
  - _self_

env:
  scenario: "VizdoomBasic-v1"
  frame_skip: 4
  frame_stack: 4
  resolution: 84
  max_episode_steps: 300

training:
  max_episodes: 5000
  log_interval: 10
  checkpoint_interval: 1000
  seed: 42
