env:
  scenario: "VizdoomBasic-v1"
  frame_skip: 4
  frame_stack: 4
  resolution: 84
  max_episode_steps: 300

training:
  learning_rate: 1.e-4
  gamma: 0.99
  max_episodes: 5000
  log_interval: 10
  checkpoint_interval: 500
  seed: 42
  clip_epsilon: 0.2
  value_loss_coeff: 0.5
  entropy_coeff: 0.01
  gae_lambda: 0.95
  ppo_epochs: 4
  minibatch_size: 64
  max_grad_norm: 0.5

paths:
  root_working_dir: "/tmp"
  model_name: "default"
